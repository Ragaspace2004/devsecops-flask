name: Semgrep SAST

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/python
            p/flask
            p/django
            p/security-audit
